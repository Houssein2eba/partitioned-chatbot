apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-chatbot
  labels:
    app: rag-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: rag-chatbot:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rag-data
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag-chatbot
spec:
  selector:
    app: rag-api
  ports:
    - name: http
      port: 8000
      targetPort: http
