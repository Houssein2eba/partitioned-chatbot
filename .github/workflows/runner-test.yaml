# Display name shown in the GitHub Actions workflow list.
name: CI/CD

# Run CI/CD for the test branch and main, or when launched manually.
on:
  push:
    branches:
      - featcher/cd
      - main
  workflow_dispatch:

# Define the CI/CD job and run it on the project's self-hosted Windows runner.
jobs:
  test:
    runs-on: [self-hosted, windows, x64]

# Execute command steps through Windows Command Prompt.
    defaults:
      run:
        shell: cmd

# Check out the repository so subsequent steps can access its files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

# Verify that the container and Kubernetes tools are installed and usable.
      - name: Check tools
        run: |
          docker --version
          kubectl version --client
          kubectl config current-context
          kubectl get nodes

# Use Python 3.11, which has compatible binary wheels for the pinned dependencies.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

# Install the application's Python dependencies from the lock-style requirements file.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

# Run the automated test suite.
      - name: Run tests
        run: python -m pytest -q

# Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
# Build the Docker image and tag it with the current Git commit SHA.
      - name: Build Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker build -t %DOCKERHUB_USERNAME%/rag-chatbot:%GITHUB_SHA% .

# Push the image to Docker Hub using the same tag.
      - name: Push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker push %DOCKERHUB_USERNAME%/rag-chatbot:%GITHUB_SHA%

# Confirm that the cluster has the application credentials before deployment.
      - name: Verify Kubernetes prerequisites
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl -n rag-chatbot get secret rag-secrets

# Create or update the Kubernetes resources used by the application.
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/10-configmap.yaml
          kubectl apply -f k8s/20-qdrant.yaml
          kubectl apply -f k8s/25-data-pvc.yaml
          kubectl apply -f k8s/30-api.yaml
          kubectl apply -f k8s/40-ui.yaml

# Point both application deployments at the immutable image built for this commit.
      - name: Deploy published image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          kubectl -n rag-chatbot set image deployment/rag-api api=%DOCKERHUB_USERNAME%/rag-chatbot:%GITHUB_SHA%
          kubectl -n rag-chatbot set image deployment/rag-ui ui=%DOCKERHUB_USERNAME%/rag-chatbot:%GITHUB_SHA%

# Wait until Kubernetes confirms that the new API and UI pods are available.
      - name: Verify Kubernetes rollout
        run: |
          kubectl -n rag-chatbot rollout status statefulset/qdrant --timeout=180s
          kubectl -n rag-chatbot rollout status deployment/rag-api --timeout=180s
          kubectl -n rag-chatbot rollout status deployment/rag-ui --timeout=180s
          kubectl -n rag-chatbot get pods -o wide